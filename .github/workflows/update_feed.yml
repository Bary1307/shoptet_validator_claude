name: Aktualizace feedů

on:
  schedule:
    - cron: "17 */3 * * *"   # každé 3 hodiny (čas UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Přeskočit kontrolu poklesu počtu produktů"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-feed.txt

      - run: pip install -r requirements-feed.txt

      - name: Převod feedů podle úloh v jobs/
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python run_feed.py --all jobs ${{ inputs.force && '--force' || '' }}

      - name: Uložení změněných feedů do repozitáře
        if: always()
        run: |
          mkdir -p feeds
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "Beze změn."
          else
            git commit -m "Aktualizace feedů"
            git push || (git pull --rebase && git push)
          fi
